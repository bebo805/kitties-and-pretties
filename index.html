<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitties & Pretties</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Playfair Display', serif;
    background: black;
    color: white;
    scroll-behavior: smooth;
}

nav {
    background: rgba(0,0,0,0.9);
    padding: 18px;
    text-align: center;
    position: sticky;
    top: 0;
    border-bottom: 1px solid white;
}

nav a {
    position: relative;
    color: white;
    text-decoration: none;
    margin: 0 20px;
    font-size: 18px;
    font-weight: bold;
}

nav a::after {
    content: "";
    position: absolute;
    width: 0;
    height: 2px;
    background: white;
    left: 0;
    bottom: -6px;
    transition: width 0.3s ease;
}

nav a:hover::after {
    width: 100%;
}

.cart {
    position: absolute;
    right: 30px;
    top: 18px;
    font-weight: bold;
}

.logo {
    font-family: 'Great Vibes', cursive;
    font-size: 75px;
    text-align: center;
    margin-top: 80px;
    text-shadow: 0 0 20px rgba(255,255,255,0.8);
}

.hero-text {
    text-align: center;
    margin-bottom: 60px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 25px;
    padding: 30px;
}

.product {
    background: rgba(255,255,255,0.05);
    border: 1px solid white;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    transition: 0.3s ease;
}

.product:hover {
    transform: translateY(-10px);
    box-shadow: 0 0 25px rgba(255,255,255,0.3);
}

.product img {
    width: 100%;
    border-radius: 10px;
}

.buy-btn {
    background: white;
    color: black;
    border: none;
    padding: 8px 18px;
    margin-top: 10px;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 30px;
    opacity: 0.6;
}
</style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="sale.html">Shop 🛍</a>
    <a href="#contact">Contact</a>
    <div class="cart">Cart 🛒: <span id="cart-count">0</span></div>
</nav>

<div class="logo">Kitties & Pretties</div>
<div class="hero-text">Luxury Streetwear for the Bold & Beautiful</div>

<div class="gallery">

<div class="product">
<img src="https://picsum.photos/400/500?1">
<h3>Black Luxe Leather</h3>
<p>$89.99</p>
<button class="buy-btn" onclick="addToCart()">Add to Cart</button>
</div>

<div class="product">
<img src="https://picsum.photos/400/500?2">
<h3>Midnight Streetwear</h3>
<p>$79.99</p>
<button class="buy-btn" onclick="addToCart()">Add to Cart</button>
</div>

</div>

<footer>
© 2026 Kitties & Pretties
</footer>

<script>
let cartCount = 0;

function addToCart() {
    cartCount++;
    document.getElementById("cart-count").textContent = cartCount;
}
</script>

</body>
</html>
