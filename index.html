<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kitties & Pretties</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Playfair Display', serif;
    background: black;
    color: white;
    scroll-behavior: smooth;
}

/* NAV */
nav {
    position: sticky;
    top: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    padding: 15px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.2);
}

nav a {
    color: white;
    margin: 0 18px;
    text-decoration: none;
    font-weight: bold;
    position: relative;
}

nav a::after {
    content: "";
    position: absolute;
    width: 0;
    height: 2px;
    background: white;
    left: 0;
    bottom: -5px;
    transition: 0.3s;
}

nav a:hover::after {
    width: 100%;
}

.cart {
    position: absolute;
    right: 20px;
    top: 15px;
}

/* LOGO */
.logo {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(40px, 8vw, 80px);
    text-align: center;
    margin: 40px 20px;
    opacity: 0;
    animation: fadeUp 1.2s ease forwards;
}

/* HERO */
.hero-text {
    text-align: center;
    opacity: 0;
    animation: fadeUp 1.5s ease forwards;
    animation-delay: 0.3s;
}

/* GRID */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    padding: 40px;
}

/* PRODUCT CARD */
.product {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    transition: all 0.4s ease;
    opacity: 0;
    transform: translateY(30px);
}

/* Smooth hover lift */
.product:hover {
    transform: translateY(-12px) scale(1.02);
    box-shadow: 0 0 30px rgba(255,255,255,0.25);
}

/* IMAGE ZOOM */
.product img {
    width: 100%;
    border-radius: 10px;
    transition: transform 0.4s ease;
}

.product:hover img {
    transform: scale(1.05);
}

/* BUTTON */
.buy-btn {
    background: white;
    color: black;
    border: none;
    padding: 10px 18px;
    margin-top: 10px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.buy-btn:hover {
    background: black;
    color: white;
    border: 1px solid white;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 30px;
    opacity: 0.5;
}

/* ANIMATIONS */
@keyframes fadeUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<nav>
    <a href="#">Home</a>
    <a href="#">Shop</a>
    <a href="#">Contact</a>
    <div class="cart">🛒 <span id="cart-count">0</span></div>
</nav>

<div class="logo">Kitties & Pretties</div>
<div class="hero-text">Luxury Streetwear for the Bold & Beautiful</div>

<div class="gallery">

<div class="product">
<img src="https://picsum.photos/400/500?1">
<h3>Black Luxe Leather</h3>
<p>$89.99</p>
<button class="buy-btn" onclick="addToCart()">Add to Cart</button>
</div>

<div class="product">
<img src="https://picsum.photos/400/500?2">
<h3>Midnight Streetwear</h3>
<p>$79.99</p>
<button class="buy-btn" onclick="addToCart()">Add to Cart</button>
</div>

</div>

<footer>
© 2026 Kitties & Pretties
</footer>

<script>
let cartCount = 0;

function addToCart() {
    cartCount++;
    document.getElementById("cart-count").textContent = cartCount;
}

/* SCROLL FADE-IN */
const products = document.querySelectorAll(".product");

const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.style.opacity = 1;
            entry.target.style.transform = "translateY(0)";
        }
    });
}, { threshold: 0.2 });

products.forEach(p => observer.observe(p));
</script>

</body>
</html>
